# Infraestructura de desarrollo: MySQL 8.4 + Mailpit.
# Uso: docker compose -f infra/docker-compose.dev.yml up -d
# Las credenciales se leen del .env de la raíz (ver .env.example); los valores por defecto son solo para dev.
name: hyskad-dev

services:
  mysql:
    image: mysql:8.4
    container_name: hyskad-mysql
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: hyskad
      MYSQL_USER: ${DB_USER:-hyskad}
      MYSQL_PASSWORD: ${DB_PASSWORD:-hyskad_dev}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root_dev}
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "127.0.0.1:${DB_HOST_PORT:-3306}:3306"
    volumes:
      - hyskad-mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u root -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  mailpit:
    image: axllent/mailpit:latest
    container_name: hyskad-mailpit
    restart: unless-stopped
    ports:
      - "127.0.0.1:1025:1025"
      - "127.0.0.1:8025:8025"

volumes:
  hyskad-mysql-data:
