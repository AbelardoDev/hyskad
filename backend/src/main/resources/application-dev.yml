# Valores por defecto SOLO para desarrollo local (docker-compose.dev.yml).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hyskad?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USER:hyskad}
    password: ${DB_PASSWORD:hyskad_dev}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jpa:
    show-sql: false
  flyway:
    # Usuarios de prueba (uno por rol), solo en dev. Ver README.
    locations: classpath:db/migration,classpath:db/dev-data

management:
  endpoint:
    health:
      show-details: always

hyskad:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:no-reply@hyskad.local}
  jwt:
    # Clave SOLO para desarrollo local; en prod JWT_SECRET es obligatoria y no tiene valor por defecto.
    secret: ${JWT_SECRET:cBIXqjjwFp2ZwC1xSjZ40uoXswaRfqX4ohIqyxEW3A21SRJwY6kKpgAPFerqi4Wf}
  auth:
    # Sin HTTPS en local: la cookie no puede llevar Secure.
    cookie-secure: false

logging:
  level:
    com.hyskad: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
