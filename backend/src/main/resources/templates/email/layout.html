<!DOCTYPE html>
<!--/* Layout de los correos: logo (CID), contenido de cada plantilla y pie con los datos del taller.
       Estilos en línea y tablas para que se vea igual en los clientes de correo. */-->
<html xmlns:th="http://www.thymeleaf.org" th:fragment="correo(titulo, contenido)" th:lang="${#locale.language}">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <title th:replace="${titulo}">HYSKAD</title>
</head>
<body style="margin:0;padding:0;background:#EEF5FF;font-family:Arial,Helvetica,sans-serif;color:#0F1D3F;">
<table role="presentation" width="100%" cellpadding="0" cellspacing="0" style="background:#EEF5FF;">
    <tr>
        <td align="center" style="padding:24px 12px;">
            <table role="presentation" width="100%" cellpadding="0" cellspacing="0"
                   style="max-width:600px;background:#ffffff;border-radius:12px;overflow:hidden;border:1px solid #D9E8FF;">
                <tr>
                    <td style="padding:24px 32px;border-bottom:4px solid #1D58E0;">
                        <img th:src="|cid:${cidLogo}|" src="cid:logo" width="240" alt="HYSKAD"
                             style="display:block;width:240px;max-width:100%;height:auto;border:0;">
                    </td>
                </tr>
                <tr>
                    <td style="padding:28px 32px;font-size:15px;line-height:1.55;">
                        <div th:replace="${contenido}">Contenido</div>
                    </td>
                </tr>
                <tr>
                    <td style="padding:20px 32px;background:#0F1D3F;color:#BBD6FF;font-size:12px;line-height:1.6;">
                        <strong style="color:#ffffff;" th:text="${taller.nombre}">Taller HYSKAD</strong><br>
                        <span th:text="|NIT ${taller.nit}|">NIT 900123456-8</span> ·
                        <span th:text="${taller.direccion}">Calle 41 # 10-25</span> ·
                        <span th:text="${taller.telefono}">6047891234</span><br>
                        <span th:text="#{comun.pie}">Este correo es informativo; no es una factura electrónica.</span>
                    </td>
                </tr>
            </table>
        </td>
    </tr>
</table>
</body>
</html>
