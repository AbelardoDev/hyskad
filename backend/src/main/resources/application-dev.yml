# Valores por defecto SOLO para desarrollo local (docker-compose.dev.yml).
spring:
  datasource:
    url: ${DB_URL:jdbc:mysql://localhost:3306/hyskad?useUnicode=true&characterEncoding=utf8&connectionTimeZone=UTC}
    username: ${DB_USER:hyskad}
    password: ${DB_PASSWORD:hyskad_dev}
  mail:
    host: ${MAIL_HOST:localhost}
    port: ${MAIL_PORT:1025}
  jpa:
    show-sql: false

management:
  endpoint:
    health:
      show-details: always

hyskad:
  base-url: ${APP_BASE_URL:http://localhost:4200}
  mail-from: ${MAIL_FROM:no-reply@hyskad.local}

logging:
  level:
    com.hyskad: DEBUG

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
