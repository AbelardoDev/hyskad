<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org"
      th:replace="~{email/layout :: correo(~{::title}, ~{this :: contenido})}">
<head><title th:text="#{orden-entregada.asunto}">Entregamos tu moto</title></head>
<body>
<div th:fragment="contenido">
    <p style="margin:0 0 16px;font-size:18px;font-weight:bold;" th:text="#{comun.saludo(${nombre})}">Hola, Ana:</p>
    <p th:text="#{orden-entregada.cuerpo(${placa}, ${moto}, ${fecha})}">Entregamos tu moto.</p>
    <table role="presentation" cellpadding="0" cellspacing="0" width="100%"
           style="margin:20px 0;border-collapse:collapse;font-size:14px;">
        <tr th:each="linea : ${lineas}">
            <td style="padding:8px 0;border-bottom:1px solid #EEF5FF;" th:text="|${linea.descripcion} × ${linea.cantidad}|">Cambio de aceite × 1</td>
            <td style="padding:8px 0 8px 12px;border-bottom:1px solid #EEF5FF;text-align:right;white-space:nowrap;" th:text="${linea.subtotal}">$ 45.000</td>
        </tr>
        <tr>
            <td style="padding:12px 0 0;text-align:right;font-weight:bold;font-size:16px;" th:text="#{orden-entregada.total-pagado}">Total pagado</td>
            <td style="padding:12px 0 0 12px;text-align:right;font-weight:bold;font-size:16px;white-space:nowrap;color:#1D58E0;" th:text="${total}">$ 53.550</td>
        </tr>
        <tr th:if="${metodo != null}">
            <td style="padding:4px 0 0;text-align:right;color:#4A5878;" th:text="#{comun.metodo}">Método de pago</td>
            <td style="padding:4px 0 0 12px;text-align:right;" th:text="#{|metodo.${metodo}|}">Efectivo</td>
        </tr>
    </table>
    <p th:text="#{orden-entregada.gracias(${numero})}">Gracias por confiar en nosotros.</p>
</div>
</body>
</html>
