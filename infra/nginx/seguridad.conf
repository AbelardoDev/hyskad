# Cabeceras de seguridad de producción (F13, CP-62). Se incluye en el server y en cada location que
# agrega cabeceras propias: en Nginx un add_header dentro de un location anula los heredados.
#
# CSP: solo recursos propios. script-src admite únicamente los scripts en línea cuyo hash calcula
# scripts/csp-hashes.mjs al construir la imagen ($csp_script_hashes). style-src necesita
# 'unsafe-inline' porque Angular inyecta los estilos de los componentes en etiquetas <style>.
add_header Content-Security-Policy "default-src 'self'; script-src 'self' $csp_script_hashes; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'self'; manifest-src 'self'; worker-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; upgrade-insecure-requests" always;
add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "DENY" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;
add_header Cross-Origin-Opener-Policy "same-origin" always;
