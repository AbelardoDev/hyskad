# La BD la provee Testcontainers (@ServiceConnection); el correo se simula.
spring:
  mail:
    host: localhost
    port: 3025

management:
  health:
    mail:
      enabled: false

hyskad:
  base-url: http://localhost:4200
  mail-from: no-reply@hyskad.test

springdoc:
  api-docs:
    enabled: true
  swagger-ui:
    enabled: true
