spring:
  application:
    name: hyskad-backend
  threads:
    virtual:
      enabled: true
  datasource:
    url: ${DB_URL}
    username: ${DB_USER}
    password: ${DB_PASSWORD}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        type:
          preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
    locations: classpath:db/migration
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USER:}
    password: ${MAIL_PASSWORD:}
  messages:
    basename: i18n/correos
    encoding: UTF-8
    fallback-to-system-locale: false
  jackson:
    time-zone: UTC
    deserialization:
      fail-on-unknown-properties: true
  data:
    web:
      pageable:
        default-page-size: 20
        max-page-size: 100

server:
  port: 8080
  error:
    include-stacktrace: never
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

springdoc:
  api-docs:
    enabled: false
    path: /api/docs/openapi
  swagger-ui:
    enabled: false
    path: /api/docs
  paths-to-match: /api/**

logging:
  pattern:
    correlation: "[%X{requestId:-}] "

hyskad:
  base-url: ${APP_BASE_URL}
  mail-from: ${MAIL_FROM}
  jwt:
    secret: ${JWT_SECRET}
    issuer: hyskad
    vigencia: 15m
  auth:
    refresh-vigencia: 7d
    cookie-secure: true
    recuperacion-vigencia: 30m
  # Solo se usan para crear el primer administrador si no existe ninguno (RN-46)
  admin:
    email: ${ADMIN_EMAIL:}
    password: ${ADMIN_PASSWORD:}
