<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <title>HYSKAD</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#F5F8FD" />
    <script>
      // Aplica tema e idioma guardados antes de que arranque Angular (sin parpadeo blanco).
      // Mantener en sincronía con ThemeService y LanguageService.
      (function () {
        var d = document.documentElement;
        try {
          var tema = localStorage.getItem('hk.tema');
          var idioma = localStorage.getItem('hk.idioma');
          var oscuro =
            tema === 'dark' ||
            (tema !== 'light' && matchMedia('(prefers-color-scheme: dark)').matches);
          if (oscuro) {
            d.classList.add('dark');
            document.querySelector('meta[name="theme-color"]').setAttribute('content', '#070D1A');
          }
          if (idioma === 'en') d.lang = 'en';
        } catch (e) {}
      })();
    </script>
    <style>
      /* Splash mientras Angular arranca y recupera la sesión (AuthService.restaurar). */
      .hk-splash {
        position: fixed;
        inset: 0;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #f5f8fd;
      }
      .dark .hk-splash {
        background: #070d1a;
      }
      .hk-splash img {
        animation: hk-splash-pulso 1.4s ease-in-out infinite;
      }
      @keyframes hk-splash-pulso {
        50% {
          opacity: 0.55;
          transform: scale(0.94);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        .hk-splash img {
          animation: none;
        }
      }
    </style>
    <link rel="icon" href="brand/favicon.svg" type="image/svg+xml" />
    <link rel="icon" href="brand/favicon.ico" sizes="any" />
    <link rel="apple-touch-icon" href="brand/apple-touch-icon.png" />
    <link rel="manifest" href="brand/site.webmanifest" />
  </head>
  <body>
    <hk-root>
      <div class="hk-splash" role="status" aria-busy="true">
        <img src="brand/logo-mark.svg" alt="HYSKAD" width="72" height="72" />
      </div>
    </hk-root>
  </body>
</html>
