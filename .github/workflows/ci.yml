name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: Pruebas, ArchUnit y cobertura
        run: ./mvnw -B verify

      - name: Reporte de JaCoCo
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: jacoco-report
          path: backend/target/site/jacoco/
          if-no-files-found: ignore

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run i18n:check
      - run: npm run contrast:check
      - run: npm run lint
      - run: npm test
      - run: npm run build

  e2e:
    name: e2e
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: |
            frontend/package-lock.json
            e2e/package-lock.json

      - name: Empaquetar el backend
        working-directory: backend
        run: ./mvnw -B -DskipTests package

      - name: Compilar el frontend (configuración e2e, con /dev/ui)
        working-directory: frontend
        run: |
          npm ci
          npm run build:e2e

      - name: Levantar MySQL, Mailpit y Nginx
        run: docker compose -f infra/docker-compose.e2e.yml up -d --wait

      - name: Arrancar el backend con el perfil e2e
        run: |
          JAR=$(ls backend/target/hyskad-backend-*.jar | grep -v plain | head -n 1)
          nohup java -jar "$JAR" --spring.profiles.active=e2e > backend-e2e.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:8080/actuator/health > /dev/null && exit 0
            sleep 2
          done
          cat backend-e2e.log
          exit 1

      - name: Instalar Playwright (Chromium)
        working-directory: e2e
        run: |
          npm ci
          npx playwright install --with-deps chromium

      # Los tres navegadores se corren en F12; aquí solo Chromium.
      - name: Pruebas E2E y accesibilidad
        working-directory: e2e
        env:
          E2E_BASE_URL: http://localhost:4300
          E2E_MAILPIT_URL: http://localhost:8026
        run: npx playwright test --project=chromium

      - name: Reporte de Playwright y log del backend
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: |
            e2e/playwright-report/
            e2e/test-results/
            backend-e2e.log
          if-no-files-found: ignore

      - name: Bajar la infraestructura
        if: always()
        run: docker compose -f infra/docker-compose.e2e.yml down -v
