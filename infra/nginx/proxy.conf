# Cabeceras hacia el backend. X-Forwarded-For lleva solo la IP que ve Nginx (no la lista que pueda
# mandar el cliente): Nginx es el único proxy, y el backend (forward-headers-strategy=framework)
# usa esa IP para el rate limit y la auditoría; con $proxy_add_x_forwarded_for se podría falsear.
proxy_http_version 1.1;
proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $remote_addr;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;
proxy_set_header X-Forwarded-Port 443;
# Nginx pone estas cabeceras para todo el sitio; se ocultan las del backend para no duplicarlas
proxy_hide_header X-Content-Type-Options;
proxy_hide_header X-Frame-Options;
# Spring Security agrega su propia HSTS al ver X-Forwarded-Proto https
proxy_hide_header Strict-Transport-Security;
